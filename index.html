<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>The Round Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #0D131A; --surface: #141C25; --raised: #1B2530;
  --line: #243140; --line-strong: #33424F;
  --text: #E7EDF2; --muted: #93A0AC; --faint: #62707C;
  --accent: #4DA8FF; --accent-hover: #72BAFF; --accent-ink: #051322;
  --up: #34D399; --down: #F87171; --warn: #FBBF24;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* layout */
.page { max-width: 1060px; margin: 0 auto; padding: 20px 20px 72px; }
.page-mid { max-width: 780px; }
.page-narrow { max-width: 620px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; margin-bottom: 24px; border-bottom: 1px solid var(--line); min-height: 50px; }
.brand { font-weight: 700; font-stretch: 85%; letter-spacing: .01em; color: var(--muted); }
.topbar-end { display: flex; justify-content: flex-end; min-width: 80px; }
@media (max-width: 520px) { .brand { display: none; } }

/* type */
.title { font-size: clamp(52px, 12vw, 104px); line-height: .9; font-weight: 800; font-stretch: 75%; letter-spacing: -.02em; margin: 40px 0 20px; }
.title-sm { font-size: clamp(40px, 8vw, 72px); margin: 6px 0 0; }
.lede { font-size: 18px; color: var(--muted); max-width: 36em; margin: 0; }
.h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.h1-sub { font-weight: 500; }
.h2 { font-size: 17px; line-height: 1.3; font-weight: 650; margin: 0 0 14px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; color: var(--text); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.panel-focus { border-color: var(--line-strong); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.empty { text-align: left; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--raised); cursor: pointer; font-weight: 600; font-size: 15px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn-quiet:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); }
.btn-danger { background: var(--down); border-color: var(--down); color: #1B0707; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn-lg { min-height: 50px; padding: 0 22px; font-size: 16px; }
.btn-icon { width: 44px; padding: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.actions > :only-child { margin-left: auto; }
.confirm { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* fields */
.field { margin: 0; padding: 0; border: 0; min-width: 0; }
.field > label, .field > legend, .code-entry > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; padding: 0; }
.input { width: 100%; min-height: 46px; padding: 0 13px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px; font-size: 16px; font-variant-numeric: tabular-nums; }
.input::placeholder { color: var(--faint); }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(77,168,255,.22); }
.input.bad { border-color: var(--down); }
.input.good { border-color: rgba(52,211,153,.55); }
.input-code { font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.affix { position: relative; }
.affix-pre { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.has-prefix .input { padding-left: 28px; }
.hint { font-size: 13px; color: var(--muted); margin: 7px 0 0; }
.err { font-size: 13.5px; color: var(--down); margin: 7px 0 0; display: flex; gap: 6px; align-items: flex-start; }
.err svg { flex-shrink: 0; margin-top: 2px; }
.ok-text { color: var(--up); display: flex; gap: 6px; align-items: flex-start; }
.ok-text svg { flex-shrink: 0; margin-top: 3px; }
.code-entry-row { display: flex; gap: 8px; }
.notice { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; padding: 10px 14px; border-radius: 9px; background: rgba(52,211,153,.1); color: var(--up); font-size: 14.5px; }

/* supplier options */
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr; } }
.opt { position: relative; display: block; padding: 13px 14px; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: rgba(77,168,255,.09); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-name { display: block; font-weight: 650; }
.opt-note { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.offer { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.radio-row { display: grid; gap: 10px; }
.radio { display: flex; gap: 10px; align-items: center; cursor: pointer; min-height: 32px; }
.radio input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.estimate { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14.5px; }
.estimate strong { color: var(--text); font-variant-numeric: tabular-nums; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 600px) { .stats-4 { grid-template-columns: 1fr 1fr; } }
.stat { background: var(--surface); padding: 13px 16px; min-width: 0; }
.stat-label { font-size: 13px; color: var(--muted); }
.stat-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-sub { font-size: 12.5px; color: var(--faint); }
@media (max-width: 460px) { .stat { padding: 11px 12px; } .stat-value { font-size: 19px; } }

/* tabs */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }

/* ticket: the code, the one thing everyone reads */
.ticket { position: relative; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 14px; padding: 18px 22px 20px; overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 49px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line-strong); }
.ticket::before { left: -10px; } .ticket::after { right: -10px; }
.ticket-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ticket-title { font-weight: 650; }
.ticket-rule { border-top: 2px dashed var(--line-strong); margin: 14px -22px 0; }
.ticket-code { font-family: var(--mono); font-weight: 600; font-size: clamp(28px, 7.5vw, 44px); letter-spacing: .06em; word-spacing: .3em; line-height: 1.2; margin: 16px 0 16px; overflow-wrap: anywhere; }
.ticket-accent .ticket-code { color: var(--accent); }
.ticket-warn .ticket-code { color: var(--warn); }
.ticket-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* news */
.news { border-left: 3px solid var(--warn); padding-left: 16px; }
.news.tone-up { border-color: var(--up); } .news.tone-down { border-color: var(--down); }
.news-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.news-head { font-size: 22px; line-height: 1.2; font-weight: 700; font-stretch: 85%; margin: 8px 0; text-wrap: balance; }
.news-body { margin: 0; color: var(--muted); max-width: 62ch; }
.news-offer { margin-top: 14px; padding: 12px 14px; border-radius: 9px; background: var(--raised); font-size: 14.5px; color: var(--muted); }
.news-offer strong { color: var(--text); }
.news-lg .news-head { font-size: clamp(36px, 5.5vw, 68px); line-height: 1.02; margin: 14px 0; }
.news-lg .news-body { font-size: clamp(18px, 1.9vw, 24px); max-width: 48ch; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.bg-up { background: var(--up); } .bg-down { background: var(--down); } .bg-warn { background: var(--warn); }

/* events */
.events { display: grid; gap: 6px; }
.event { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; transition: border-color .15s, background .15s; }
.event:hover { border-color: var(--line-strong); }
.event.on { border-color: var(--accent); background: rgba(77,168,255,.09); }
.event .dot { margin-top: 7px; }
.event-name { display: block; font-weight: 650; }
.event-desc { display: block; font-size: 13.5px; color: var(--muted); }

/* stepper */
.round-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; list-style: none; padding: 0; margin: 20px 0 22px; }
.stepper li { flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 0 12px; border-bottom: 2px solid var(--line); color: var(--faint); font-weight: 600; font-size: 14.5px; }
.stepper li.done { color: var(--muted); border-color: var(--line-strong); }
.stepper li.now { color: var(--text); border-color: var(--accent); }
.stepper-n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 12.5px; flex-shrink: 0; }
.stepper li.now .stepper-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (max-width: 560px) { .stepper li { font-size: 0; justify-content: center; } .stepper li.now { font-size: 13.5px; } .stepper-n { font-size: 12.5px; } }

/* code rows */
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: start; }
.row-name { font-weight: 650; padding-top: 11px; overflow-wrap: anywhere; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 6px; } .row-name { padding-top: 0; } }
.count { font-size: 14px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }

/* report list */
.report-list { list-style: none; margin: 0; padding: 0; }
.report-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.report-team { font-weight: 650; }
.report-code { font-family: var(--mono); color: var(--up); letter-spacing: .04em; word-spacing: .2em; font-size: 14.5px; }

/* standings */
.board { list-style: none; margin: 0; padding: 0; }
.board-row { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 14px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
.board-row:first-child { border-top: 0; }
.rank { color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }
.board-row.first .rank { color: var(--warn); }
.board-name { font-weight: 650; overflow-wrap: anywhere; }
.board-delta { font-size: 14px; font-variant-numeric: tabular-nums; }
.board-cash { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.board-lg .board-row { grid-template-columns: 1.4em 1fr auto auto; gap: .8em; padding: .5em 0; font-size: clamp(22px, 3.4vw, 42px); }
.board-lg .board-delta { font-size: .6em; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14.5px; }
th { text-align: right; font-weight: 600; color: var(--muted); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
tr:last-child td { border-bottom: 0; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart-area { fill: var(--accent); opacity: .12; }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart-dot { fill: var(--accent); }
.c-up .chart-area, .c-up .chart-dot { fill: var(--up); } .c-up .chart-line { stroke: var(--up); }
.chart-zero { stroke: var(--line-strong); stroke-width: 1; }
.bar-up { fill: var(--up); } .bar-down { fill: var(--down); }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 6px; font-variant-numeric: tabular-nums; }

/* setup */
.team-edit { display: flex; gap: 8px; }
.preview { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.preview-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-variant-numeric: tabular-nums; font-size: 14.5px; }

/* home */
.roles { display: grid; gap: 12px; margin: 36px 0 22px; }
.role { display: grid; gap: 4px; text-align: left; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; transition: border-color .15s; }
.role:hover { border-color: var(--accent); }
.role-name { font-size: 20px; font-weight: 700; }
.role-desc { color: var(--muted); }

/* guide */
.codes-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.codes-legend > div { display: flex; gap: 12px; align-items: flex-start; }
.codes-legend p { margin: 4px 0 0; }
@media (max-width: 720px) { .codes-legend { grid-template-columns: 1fr; } }
.code-chip { font-family: var(--mono); font-weight: 700; font-size: 18px; width: 38px; height: 38px; border-radius: 9px; display: inline-grid; place-items: center; flex-shrink: 0; background: var(--raised); border: 1px solid var(--line-strong); }
.code-chip.warn { color: var(--warn); } .code-chip.accent { color: var(--accent); } .code-chip.up { color: var(--up); }
.steps-list { margin: 0; padding-left: 22px; display: grid; gap: 10px; color: var(--muted); }
.steps-list li::marker { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

/* present */
.present { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 72px) 6vw calc(env(safe-area-inset-bottom, 0px) + 40px); }
.present-close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; z-index: 51; }
.present-inner { max-width: 1200px; margin: 0 auto; }
.present-code { margin-top: 48px; display: grid; gap: 4px; }
.big-code { font-family: var(--mono); font-weight: 600; color: var(--warn); font-size: clamp(56px, 12vw, 150px); letter-spacing: .08em; line-height: 1; }
.present-kicker { font-size: clamp(18px, 2vw, 24px); margin: 0 0 20px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* refinements after visual review */
.input-code::placeholder { text-transform: none; letter-spacing: .02em; }
th:last-child, td:last-child { padding-right: 0; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chart-head .h2 { margin-bottom: 10px; }
.chart-now { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.axis { position: relative; height: 18px; margin-top: 4px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.news-lg .news-top .muted { font-size: clamp(16px, 1.8vw, 24px); }
.news-lg .tag { font-size: clamp(14px, 1.5vw, 20px); padding: 6px 16px; }

.boot { max-width: 520px; margin: 18vh auto 0; padding: 0 20px; color: var(--muted); }
</style>
</head>
